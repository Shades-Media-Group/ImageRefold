name: Bug report
description: Something doesn't work.
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ImageRefold version
      description: Shown at the bottom of the plugin.
      placeholder: 0.1.0
  - type: input
    id: environment
    attributes:
      label: Figma and system
      placeholder: Figma desktop 125 on macOS, or Figma in Chrome 152
